<!doctype html>
<html>
  <head>
    <base target="_top">
    <style>
      body{font-family:Arial,sans-serif;margin:0;background:#f6faf7;color:#17172f}
      button,input,textarea,select{font:inherit}
      button{cursor:pointer}
      .wrap{padding:10px 10px 58px}
      .brand{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;margin:-10px -10px 8px;padding:10px;background:#f6faf7;border-bottom:1px solid #dfe9e3}
      .logo{width:30px;height:30px;border-radius:9px;background:#168a3a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
      .title{font-weight:800;font-size:16px}
      .muted{color:#6b7b8d}.small{font-size:12px}.hidden{display:none}
      .card{background:#fff;border:1px solid #dfe9e3;border-radius:12px;padding:9px;margin:7px 0;box-shadow:0 6px 18px rgba(14,63,34,.05)}
      .stack{display:flex;flex-direction:column;gap:6px}.row{display:flex;gap:7px;align-items:center;justify-content:space-between}.row.wraprow{flex-wrap:wrap}
      .avatar{width:28px;height:28px;border-radius:999px;background:#eaf7ef;color:#168a3a;display:grid;place-items:center;font-weight:900}
      .user{min-width:0;display:flex;align-items:center;gap:7px}
      .user b{max-width:128px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
      .input{width:100%;box-sizing:border-box;border:1px solid #d6e2dc;border-radius:9px;padding:8px;background:#fff;color:#17172f;font-size:13px}
      .btn{border:0;border-radius:9px;background:#168a3a;color:#fff;font-weight:800;padding:8px 10px;font-size:13px}
      .btn.secondary{background:#fff;color:#17172f;border:1px solid #d6e2dc}
      .btn.danger{background:#fff;color:#b42318;border:1px solid #f0c6c6}
      .btn.smallbtn{padding:7px 9px;font-size:12px}
      .btn:disabled{opacity:.55;cursor:not-allowed}
      .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
      .template{min-height:62px;border:1px solid #dfe9e3;border-radius:12px;padding:8px;background:#fff;text-align:center;font-weight:800;font-size:11px;display:grid;place-items:center;gap:3px;transition:background .15s ease,border-color .15s ease,transform .15s ease}
      .template:hover,.template:focus{transform:translateY(-1px)}
      .template span:first-child{font-size:18px;line-height:1}
      .template:hover,.item:hover{border-color:#168a3a;background:#f3fbf6}
      .item{border:1px solid #dfe9e3;border-radius:10px;padding:8px;background:#fff;text-align:left}
      .item.active{border-color:#168a3a;background:#eaf7ef}
      .pill{border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;text-transform:capitalize}
      .pill.draft{background:#f3f4f6;color:#5b6470}.pill.live{background:#eaf7ef;color:#168a3a}.pill.closed{background:#fff3e2;color:#b85b00}
      .status{padding:10px;border-radius:10px;background:#eaf7ef;color:#168a3a;font-weight:700}
      .error{background:#fff0f0;color:#b42318}.permission{background:#fff8e6;color:#7a4b00;border:1px solid #f3d184}
      .link{color:#168a3a;font-weight:800;text-decoration:none}
      .divider{height:1px;background:#e6eee9;margin:3px 0}
      .section-toggle{width:100%;border:0;background:transparent;padding:0;display:flex;justify-content:space-between;font-weight:900;color:#17172f}
      .bottom-bar{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:8px 10px;background:rgba(246,250,247,.96);border-top:1px solid #dfe9e3;z-index:5}
      .live-panel{border:1px solid #cbead4;background:linear-gradient(180deg,#ffffff,#f3fbf6)}
      .live-dot{width:8px;height:8px;border-radius:999px;background:#168a3a;box-shadow:0 0 0 4px rgba(22,138,58,.12)}
      .bar-row{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;margin:6px 0}
      .bar-track{height:8px;border-radius:999px;background:#e3e7e5;overflow:hidden;margin-top:3px}
      .bar-fill{height:100%;border-radius:999px;background:#168a3a}
      .wordbox{min-height:120px;border:1px dashed #cbead4;border-radius:12px;padding:8px;background:#fbfffc;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:8px;overflow:hidden}
      .word{font-weight:900;line-height:1;color:#168a3a}
      .response-card{border:1px solid #e4eee8;border-radius:10px;padding:7px;background:#fff;font-size:12px}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">
        <div class="logo">🎯</div>
        <div>
          <div class="title">SlideEngage</div>
          <div class="small muted">Google Slides Add-on</div>
        </div>
      </div>
      <div id="status" class="status hidden"></div>

      <section id="login" class="card stack">
        <b>Lecturer login</b>
        <div class="small muted">Use your SlideEngage website email/Gmail and password.</div>
        <div id="permission" class="status permission hidden"></div>
        <button class="btn secondary" onclick="authorize()">Authorize Google Slides Add-on</button>
        <input id="email" class="input" placeholder="Email">
        <input id="password" class="input" type="password" placeholder="Password">
        <button class="btn" onclick="login()">Sign in</button>
      </section>

      <section id="app" class="hidden">
        <div class="row">
          <div class="user">
            <div class="avatar" id="avatar">A</div>
            <b id="hello"></b>
          </div>
          <button class="btn secondary smallbtn" onclick="logout()">Logout</button>
        </div>

        <div class="card stack" id="event-card">
          <button class="section-toggle" onclick="toggleSection('event-body')" type="button"><span>Event</span><span>⌄</span></button>
          <div id="event-body" class="stack">
          <select id="events" class="input" onchange="selectEvent()"></select>
          <div id="eventInfo" class="small muted">Select or create an event.</div>
          <button class="btn secondary smallbtn" onclick="toggleNewEvent()" type="button">+ New Event</button>
          <div id="new-event-row" class="row hidden">
            <input id="newEventName" class="input" placeholder="New event name">
            <button class="btn smallbtn" onclick="createEvent()">Create</button>
          </div>
          </div>
        </div>

        <div class="card stack">
          <button class="section-toggle" onclick="toggleSection('templates')" type="button"><span>Create New Interaction</span><span>⌄</span></button>
          <div id="templates" class="grid"></div>
        </div>

        <div class="card stack">
          <div class="row">
            <b>Interactions</b>
            <button class="btn secondary smallbtn" onclick="refresh()">Refresh</button>
          </div>
          <div id="interactions" class="stack"></div>
        </div>

        <div id="editor" class="card stack hidden">
          <div class="row">
            <b id="editorTitle">Editor</b>
            <span id="interactionStatus" class="pill draft">Draft</span>
          </div>
          <textarea id="question" class="input" rows="3" placeholder="Question"></textarea>
          <div id="options" class="stack"></div>
          <button id="addOption" class="btn secondary hidden" onclick="addOption()">+ Add option</button>
          <div id="settings" class="stack"></div>
          <button class="btn secondary" onclick="saveInteraction()">Save</button>
          <div class="row">
            <button class="btn secondary smallbtn" onclick="goLive()">Go Live</button>
            <button class="btn secondary smallbtn" onclick="closeLive()">Close</button>
          <button class="btn danger smallbtn" onclick="deleteSelected()" title="Delete interaction" aria-label="Delete interaction">🗑 Delete Interaction</button>
          </div>
        </div>

        <div id="liveControls" class="card stack hidden">
          <b>Live presentation</b>
          <button id="presentLiveButton" class="btn" onclick="presentLive()">Add to Presentation</button>
          <button class="btn danger" onclick="resetResults()">Reset Results</button>
          <div class="divider"></div>
          <button class="btn secondary" onclick="openPresenter()">Open Live Results</button>
        </div>

        <div id="liveResults" class="card stack live-panel hidden">
          <div class="row">
            <b>Live Results</b>
            <span class="row small muted" style="gap:5px"><span class="live-dot"></span><span id="liveIndicator">Live updating…</span></span>
          </div>
          <div id="liveResultsBody" class="stack small muted">Go live to see responses here.</div>
        </div>

        <div class="bottom-bar">
          <button class="btn secondary smallbtn" onclick="refresh()" title="Reload latest data" aria-label="Reload latest data">Refresh</button>
          <button id="bottomAddSlideButton" class="btn smallbtn" onclick="presentLive()" title="Add interaction slide to Google Slides" aria-label="Add interaction slide to Google Slides">Add Slide</button>
          <button class="btn secondary smallbtn" onclick="openPresenter()" title="Open realtime live results" aria-label="Open realtime live results">Live Results</button>
        </div>
      </section>
    </div>

    <script>
      var REALTIME_CONFIG={url:'<?= getSupabaseUrl_() ?>',anonKey:'<?= getSupabaseAnonKey_() ?>'};
      var state={session:null,events:[],selectedEvent:null,interactions:[],selectedInteraction:null,template:null,options:[],config:{},liveResults:null};
      var realtimeClient=null;
      var realtimeChannel=null;
      var liveFetchTimer=null;
      var slideUpdateTimer=null;
      var slideUpdateInFlight=false;
      var pendingSlideUpdateInteractionId=null;
      var liveSlideActive=false;
      var slideCreateInFlight=false;
      var templates=[
        {label:"Multiple Choice",type:"poll",options:["Option 1","Option 2"],config:{poll_kind:"multiple_choice",multiple_answers:false,results_visible:true,voting_open:true}},
        {label:"Open Text",type:"feedback",options:[],config:{poll_kind:"open_text",character_limit:280,anonymous:true,voting_open:true}},
        {label:"Word Cloud",type:"word_cloud",options:[],config:{max_words_per_participant:3,allow_duplicate_words:true,voting_open:true}},
        {label:"Rating",type:"feedback",options:[],config:{poll_kind:"rating",scale:5,include_star_ratings:true,voting_open:true}},
        {label:"Quiz",type:"quiz",options:["Correct answer","Distractor"],config:{time_limit_seconds:30,points:100,voting_open:true}},
        {label:"Audience Q&A",type:"qa",options:[],config:{moderation:false,character_limit:160,allow_replies:false,allow_anonymous_questions:true,voting_open:true}}
      ];

      function $(id){return document.getElementById(id)}
      function show(message,isError){var s=$("status");s.textContent=message||"";s.className="status"+(isError?" error":"")+(message?"":" hidden")}
      function call(name,args,ok,statusText){if(statusText!==null)show(statusText===undefined?"Loading...":statusText);google.script.run.withSuccessHandler(function(result){if(statusText!==null)show("");ok&&ok(result)}).withFailureHandler(function(err){handleFailure(err)})[name].apply(null,args||[])}
      function handleFailure(err){if(slideCreateInFlight)setSlideCreating(false);var message=(err&&err.message)||String(err);if(/invalid email|invalid slideengage/i.test(message))message="Invalid SlideEngage email or password.";if(/Unable to load live results|Interaction not found|event for this slide|interaction for this slide/i.test(message))message="Unable to load live results. Please refresh and try again.";if(/UrlFetchApp|external_request|permission|authorization|not have permission|authorize|internet/i.test(message))message="Authorization required. Please click Authorize and allow Google permissions.";show(message,true);if(/authorize|permission|internet/i.test(message))checkAuthorization()}
      function boot(){renderTemplates();checkAuthorization();call("getInitialState",[],function(result){state.session=result.session;state.events=result.events||[];state.selectedEvent=result.selectedEvent||null;state.interactions=result.interactions||[];render()})}
      function checkAuthorization(){google.script.run.withSuccessHandler(function(result){var box=$("permission");if(!result||result.authorized){box.classList.add("hidden");return}box.innerHTML="Google permission is required before SlideEngage can connect to your account. <a class=\"link\" target=\"_blank\" href=\""+result.authorizationUrl+"\">Open authorization</a>";box.classList.remove("hidden")}).withFailureHandler(function(){}).getAuthorizationStatus()}

      function render(){
        if(state.session){$("login").classList.add("hidden");$("app").classList.remove("hidden");$("hello").textContent=state.session.lecturer.name||state.session.lecturer.email;$("hello").title=state.session.lecturer.email||"";$("avatar").textContent=((state.session.lecturer.name||state.session.lecturer.email||"A").charAt(0)||"A").toUpperCase()}
        else{$("login").classList.remove("hidden");$("app").classList.add("hidden")}
        renderEvents();renderInteractions();renderEditor();renderLiveControls();renderLiveResults()
      }
      function renderTemplates(){var box=$("templates");box.innerHTML="";templates.forEach(function(t){var b=document.createElement("button");b.className="template";b.innerHTML="<span>"+iconFor(t)+"</span><span>"+shortLabel(t.label)+"</span>";b.title=tooltipFor(t.label);b.setAttribute("aria-label",tooltipFor(t.label));b.onclick=function(){openTemplate(t)};box.appendChild(b)})}
      function renderEvents(){var sel=$("events");sel.innerHTML="";var placeholder=document.createElement("option");placeholder.textContent=state.events.length?"Select event":"No events yet";placeholder.value="";sel.appendChild(placeholder);state.events.forEach(function(event){var option=document.createElement("option");option.value=event.id;option.textContent=(event.event_name||"Untitled")+" (#"+event.event_code+")";if(state.selectedEvent&&state.selectedEvent.id===event.id)option.selected=true;sel.appendChild(option)});$("eventInfo").textContent=state.selectedEvent?"Code: #"+state.selectedEvent.event_code+" | "+(state.selectedEvent.status||"closed"):"Please select an event."}
      function renderInteractions(){var list=$("interactions");list.innerHTML="";if(!state.interactions.length){list.innerHTML="<div class=\"small muted\">No interactions yet. Create one above.</div>";return}state.interactions.forEach(function(interaction){var row=document.createElement("div");row.className="item"+(state.selectedInteraction&&state.selectedInteraction.id===interaction.id?" active":"");var status=interaction.status||"draft";row.innerHTML="<div class=\"row\"><div style=\"min-width:0\"><b style=\"font-size:13px\">"+escapeHtml(interaction.title||"Untitled")+"</b><div class=\"small muted\">"+label(interaction)+"</div></div><span class=\"pill "+status+"\" title=\""+status+"\">"+status+"</span></div><div class=\"row wraprow\" style=\"margin-top:6px\"><button class=\"btn secondary smallbtn\" data-action=\"edit\" title=\"Edit interaction\" aria-label=\"Edit interaction\">Edit</button><button class=\"btn smallbtn\" data-action=\"present\" title=\"Show live results\" aria-label=\"Show live results\">Present</button><button class=\"btn danger smallbtn\" data-action=\"delete\" title=\"Delete interaction\" aria-label=\"Delete interaction\">🗑 Delete</button></div>";row.onclick=function(){openInteraction(interaction)};row.querySelector("[data-action=edit]").onclick=function(e){e.stopPropagation();openInteraction(interaction)};row.querySelector("[data-action=present]").onclick=function(e){e.stopPropagation();openInteraction(interaction);presentLive()};row.querySelector("[data-action=delete]").onclick=function(e){e.stopPropagation();deleteInteractionFromList(interaction)};list.appendChild(row)})}
      function iconFor(t){return t.type==="poll"?"📊":t.type==="word_cloud"?"☁️":t.type==="quiz"?"🎯":t.type==="qa"?"💬":t.config&&t.config.poll_kind==="rating"?"⭐":"📝"}
      function shortLabel(label){return label==="Multiple Choice"?"Poll":label==="Open Text"?"Text":label==="Audience Q&A"?"Q&A":label}
      function tooltipFor(label){return label==="Multiple Choice"?"Create a poll with answer options":label==="Open Text"?"Collect text responses from participants":label==="Word Cloud"?"Create a live word cloud":label==="Rating"?"Create rating question":label==="Quiz"?"Create quiz":label==="Audience Q&A"?"Create audience Q&A":"Create interaction"}
      function toggleSection(id){$(id).classList.toggle("hidden")}
      function toggleNewEvent(){$("new-event-row").classList.toggle("hidden")}
      function renderEditor(){var editor=$("editor");if(!state.selectedInteraction&&!state.template){editor.classList.add("hidden");return}editor.classList.remove("hidden");$("editorTitle").textContent=state.template?state.template.label:label(state.selectedInteraction);var status=(state.selectedInteraction&&state.selectedInteraction.status)||"draft";$("interactionStatus").textContent=status;$("interactionStatus").className="pill "+status;$("question").value=(state.selectedInteraction&&state.selectedInteraction.title)||"";renderOptions();renderSettings()}
      function renderOptions(){var needs=needsOptions();$("addOption").classList.toggle("hidden",!needs);var box=$("options");box.innerHTML="";if(!needs)return;state.options.forEach(function(option,index){var row=document.createElement("div");row.className="row";row.innerHTML="<input class=\"input\" value=\""+escapeAttr(option.option_text||"")+"\" placeholder=\"Option "+(index+1)+"\"><button class=\"btn danger smallbtn\">×</button>";row.querySelector("input").oninput=function(){state.options[index].option_text=this.value};row.querySelector("button").onclick=function(){state.options.splice(index,1);renderOptions()};box.appendChild(row)})}
      function renderSettings(){var box=$("settings");box.innerHTML="";var type=currentType();if(type==="poll")box.innerHTML=checkboxSetting("multiple_answers","Multiple answers");if(type==="word_cloud")box.innerHTML=numberSetting("max_words_per_participant","Max words",1,10)+checkboxSetting("allow_duplicate_words","Allow duplicates");if(type==="feedback"&&state.config.poll_kind==="open_text")box.innerHTML=numberSetting("character_limit","Character limit",50,1000);if(type==="feedback"&&state.config.poll_kind==="rating")box.innerHTML=numberSetting("scale","Rating scale",2,10);if(type==="quiz")box.innerHTML=numberSetting("time_limit_seconds","Timer seconds",5,300);if(type==="qa")box.innerHTML=checkboxSetting("moderation","Moderation")+checkboxSetting("allow_replies","Replies")+numberSetting("character_limit","Character limit",50,500)}
      function renderLiveControls(){var visible=!!state.selectedInteraction&&!!state.selectedEvent;$("liveControls").classList.toggle("hidden",!visible);var btn=$("presentLiveButton");if(btn)btn.textContent=liveSlideActive?"Slide added":"Add to Presentation"}
      function renderLiveResults(){var panel=$("liveResults");if(!state.selectedInteraction||!state.selectedEvent){panel.classList.add("hidden");return}panel.classList.remove("hidden");var body=$("liveResultsBody");var data=state.liveResults;if(!data){body.innerHTML="<div class=\"muted\">Go live to see responses here.</div>";return}var interaction=data.interaction||state.selectedInteraction;var html="<div><b>"+escapeHtml(data.question||interaction.title||"Untitled")+"</b><div class=\"small muted\">#"+escapeHtml(data.eventCode||state.selectedEvent.event_code||"")+" · "+(data.total_responses||0)+" responses</div></div>";var results=data.results||[];if(interaction.type==="poll"||interaction.type==="quiz"){html+=renderPollResultsHtml(results)}else if(interaction.type==="word_cloud"){html+=renderWordCloudHtml(results)}else if(interaction.type==="qa"){html+=renderCardsHtml(results,"question_text","No questions yet.")}else if(interaction.type==="feedback"&&interaction.config&&interaction.config.poll_kind==="rating"){html+=renderRatingHtml(results)}else{var items=Array.isArray(results)?results:(results.text_responses||[]);html+=renderCardsHtml(items,"text","No responses yet.")}body.innerHTML=html;$("liveIndicator").textContent="Live updating…"}
      function renderPollResultsHtml(results){if(!results.length)return"<div class=\"muted\">Waiting for responses…</div>";var html="";results.forEach(function(row){var percent=Number(row.percentage||0);html+="<div class=\"bar-row\"><div><b>"+escapeHtml(row.option_text||row.label||"Option")+"</b><div class=\"bar-track\"><div class=\"bar-fill\" style=\"width:"+Math.max(2,percent)+"%\"></div></div></div><b>"+percent+"% · "+(row.count||0)+"</b></div>"});return html}
      function renderWordCloudHtml(results){if(!results.length)return"<div class=\"wordbox muted\">Waiting for responses…</div>";var html="<div class=\"wordbox\">";var max=Math.max.apply(null,results.map(function(item){return Number(item.count||1)}));results.slice(0,36).forEach(function(item,index){var count=Number(item.count||1);var size=Math.max(12,Math.min(30,12+(count/max)*16+(index<3?4:0)));var colors=["#168A3A","#1A6BB5","#D46B08","#7C3AED","#0F766E","#BE185D"];html+="<span class=\"word\" style=\"font-size:"+size+"px;color:"+colors[index%colors.length]+"\">"+escapeHtml(item.word||item.text||"")+"</span>"});html+="</div>";return html}
      function renderRatingHtml(results){var avg=Number(results&&results.average_rating?results.average_rating:0);var count=Number(results&&results.rating_count?results.rating_count:0);if(!count)return"<div class=\"muted\">Waiting for responses…</div>";return"<div class=\"row\"><div><div style=\"font-size:34px;font-weight:900;color:#168a3a\">"+avg.toFixed(1)+"</div><div class=\"small muted\">average rating</div></div><b>"+count+" responses</b></div><div class=\"bar-track\"><div class=\"bar-fill\" style=\"width:"+Math.min(100,avg/5*100)+"%\"></div></div>"}
      function renderCardsHtml(items,key,emptyText){if(!items.length)return"<div class=\"muted\">"+emptyText+"</div>";var html="";items.slice(0,5).forEach(function(item){html+="<div class=\"response-card\">"+escapeHtml(item[key]||item.text_value||item.text||JSON.stringify(item))+"</div>"});return html}

      function checkboxSetting(key,labelText){return "<label class=\"small\"><input type=\"checkbox\" "+(state.config[key]?"checked":"")+" onchange=\"state.config['"+key+"']=this.checked\"> "+labelText+"</label>"}
      function numberSetting(key,labelText,min,max){return "<label class=\"small\">"+labelText+"<input class=\"input\" type=\"number\" min=\""+min+"\" max=\""+max+"\" value=\""+(state.config[key]||min)+"\" onchange=\"state.config['"+key+"']=Number(this.value)\"></label>"}
      function label(interaction){return interaction.type==="poll"?"Multiple Choice":interaction.type==="word_cloud"?"Word Cloud":interaction.type==="quiz"?"Quiz":interaction.type==="qa"?"Audience Q&A":interaction.config&&interaction.config.poll_kind==="rating"?"Rating":"Open Text"}
      function currentType(){return(state.template&&state.template.type)||(state.selectedInteraction&&state.selectedInteraction.type)}
      function needsOptions(){var type=currentType();return type==="poll"||type==="quiz"}
      function escapeHtml(value){return String(value||"").replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
      function escapeAttr(value){return escapeHtml(value).replace(/"/g,"&quot;")}

      function authorize(){call("authorizeSlideEngage",[],function(){checkAuthorization();if($("email").value&&$("password").value){login();return}show("Google permission confirmed. Please sign in again.")})}
      function login(){call("loginSlideEngage",[$("email").value,$("password").value],function(result){state.session=result;refresh()})}
      function logout(){unsubscribeRealtime();call("logout",[],function(){state={session:null,events:[],selectedEvent:null,interactions:[],selectedInteraction:null,template:null,options:[],config:{},liveResults:null};render();show("Signed out.")})}
      function refresh(){call("getInitialState",[],function(result){state.session=result.session;state.events=result.events||[];state.selectedEvent=result.selectedEvent||null;state.interactions=result.interactions||[];if(state.selectedInteraction){var found=findInteraction(state.selectedInteraction.id);state.selectedInteraction=found||null;if(!found)unsubscribeRealtime()}render()})}
      function selectEvent(){unsubscribeRealtime();call("selectEvent",[$("events").value],function(result){state.selectedEvent=result.selectedEvent;state.interactions=result.interactions||[];state.selectedInteraction=null;state.template=null;state.options=[];state.config={};state.liveResults=null;render()})}
      function createEvent(){call("createEvent",[$("newEventName").value],function(result){$("newEventName").value="";$("new-event-row").classList.add("hidden");state.events=result.events||[];state.selectedEvent=result.selectedEvent;state.interactions=[];state.selectedInteraction=null;render()})}
      function openTemplate(template){unsubscribeRealtime();liveSlideActive=false;if(!state.selectedEvent){show("Select or create an event first.",true);return}state.template=template;state.selectedInteraction=null;state.liveResults=null;state.options=(template.options||[]).map(function(text,index){return{option_text:text,is_correct:index===0&&template.type==="quiz"}});state.config=copy(template.config||{});render()}
      function openInteraction(interaction){state.selectedInteraction=interaction;state.template=null;state.options=(interaction.interaction_options||[]).sort(function(a,b){return(a.position||0)-(b.position||0)}).map(function(option){return{option_text:option.option_text,is_correct:!!option.is_correct}});state.config=copy(interaction.config||{});call("getInteractionSlideState",[interaction.id],function(result){liveSlideActive=!!(result&&result.exists);renderLiveControls()},null);if(interaction.status==="live"){startLiveResults(interaction)}else{unsubscribeRealtime();state.liveResults=null}render()}
      function addOption(){state.options.push({option_text:"Option "+(state.options.length+1),is_correct:false});renderOptions()}
      function copy(obj){return JSON.parse(JSON.stringify(obj||{}))}
      function findInteraction(id){for(var i=0;i<state.interactions.length;i++){if(state.interactions[i].id===id)return state.interactions[i]}return null}
      function editorPayload(){return{id:state.selectedInteraction&&state.selectedInteraction.id,event_id:state.selectedEvent&&state.selectedEvent.id,type:currentType(),title:$("question").value.trim(),config:state.config,options:needsOptions()?state.options:[]}}
      function validatePayload(payload){if(!payload.event_id)return"Select or create an event first.";if(!payload.title)return"Question is required.";if((payload.type==="poll"||payload.type==="quiz")&&payload.options.filter(function(o){return String(o.option_text||"").trim()}).length<2)return"At least 2 options are required.";return""}
      function saveInteraction(done){var payload=editorPayload();var error=validatePayload(payload);if(error){show(error,true);return}call("saveInteraction",[payload],function(result){state.selectedInteraction=result.interaction;state.template=null;state.interactions=result.interactions||[];openInteraction(result.interaction);show("Saved.");done&&done(result.interaction)})}
      function setStatus(id,status){call("setInteractionStatus",[id,status],function(result){state.selectedInteraction=result.interaction;state.interactions=result.interactions||[];openInteraction(result.interaction);show(status==="live"?"Interaction is live.":"Interaction closed.")})}
      function goLive(){if(!state.selectedInteraction){saveInteraction(function(interaction){setStatus(interaction.id,"live")});return}setStatus(state.selectedInteraction.id,"live")}
      function closeLive(){if(!state.selectedInteraction)return;setStatus(state.selectedInteraction.id,"closed")}
      function confirmDeleteInteraction(interaction){if(!interaction)return false;if(interaction.status==="live"&&!confirm("This interaction is currently live.\n\nDeleting it will immediately stop participant submissions and remove all collected responses."))return false;return confirm("Delete Interaction?\n\nAre you sure you want to delete this interaction?\n\nThis action cannot be undone.")}
      function deleteInteractionFromList(interaction){if(!interaction||!state.selectedEvent)return;if(!confirmDeleteInteraction(interaction))return;call("deleteInteraction",[interaction.id,state.selectedEvent.id],function(result){state.interactions=result.interactions||[];if(state.selectedInteraction&&state.selectedInteraction.id===interaction.id){state.selectedInteraction=null;state.template=null;state.options=[];state.config={};state.liveResults=null;unsubscribeRealtime()}render();show("Interaction deleted successfully.")})}
      function deleteSelected(){deleteInteractionFromList(state.selectedInteraction)}
      function resetResults(){if(!state.selectedInteraction)return;if(!confirm("Reset all participant responses for this interaction?"))return;call("resetResults",[state.selectedInteraction.id],function(result){show((result&&result.message)||"Results cleared successfully.");fetchLiveResults(state.selectedInteraction.id)})}
      function setSlideCreating(active,label){slideCreateInFlight=active;var main=$("presentLiveButton");var bottom=$("bottomAddSlideButton");[main,bottom].forEach(function(btn){if(!btn)return;btn.disabled=active;if(active)btn.dataset.previousLabel=btn.textContent;btn.textContent=active?(label||"Creating slide..."):(btn.dataset.previousLabel||btn.textContent)});if(!active){renderLiveControls();if(bottom)bottom.textContent="Add Slide"}}
      function presentLive(){if(slideCreateInFlight)return;var payload=editorPayload();var validation=validatePayload(payload);if(validation){show(validation,true);return}setSlideCreating(true,"Creating slide...");saveInteraction(function(interaction){show("Creating slide...");call("getInteractionSlideState",[interaction.id],function(stateResult){var insertNew=false;if(stateResult&&stateResult.exists)insertNew=!confirm("A SlideEngage interaction slide already exists. Update existing slide? Click Cancel to insert a new one.");call("presentLiveSlide",[state.selectedEvent.id,interaction.id,insertNew],function(result){state.selectedInteraction.status="live";liveSlideActive=true;show("Slide added successfully.");setLiveIndicator("Live updating…");startLiveResults(state.selectedInteraction);setSlideCreating(false);renderLiveControls()},"Creating slide...")},"Creating slide...")})}
      function openPresenter(){if(!state.selectedEvent||!state.selectedInteraction){show("Select an interaction first.",true);return}call("getLiveResultUrl",[state.selectedEvent.id,state.selectedInteraction.id],function(url){var separator=url.indexOf("?")>=0?"&":"?";var sourceUrl=url+separator+"source=google-slides";showPresenterLink(sourceUrl,"Opening live results.");window.open(sourceUrl,"_blank")})}
      function showPresenterLink(url,message){show(message+" If it did not open, use this link: "+url)}
      function startLiveResults(interaction){if(!interaction||!state.selectedEvent)return;fetchLiveResults(interaction.id);subscribeRealtime(interaction.id)}
      function fetchLiveResults(interactionId){if(!state.selectedEvent||!interactionId)return;setLiveIndicator("Live updating…");google.script.run.withSuccessHandler(function(result){state.liveResults=result;renderLiveResults();setLiveIndicator("Live updating…")}).withFailureHandler(function(err){setLiveIndicator("Update failed");handleFailure(err)}).getLiveResultSnapshot(state.selectedEvent.id,interactionId)}
      function subscribeRealtime(interactionId){unsubscribeRealtime();if(!window.supabase||!REALTIME_CONFIG.url||!REALTIME_CONFIG.anonKey){$("liveIndicator").textContent="Realtime unavailable";return}realtimeClient=window.supabase.createClient(REALTIME_CONFIG.url,REALTIME_CONFIG.anonKey);realtimeChannel=realtimeClient.channel("interaction-results-"+interactionId).on("postgres_changes",{event:"*",schema:"public",table:"responses",filter:"interaction_id=eq."+interactionId},function(){queueLiveFetch(interactionId)}).on("postgres_changes",{event:"*",schema:"public",table:"qa_questions",filter:"interaction_id=eq."+interactionId},function(){queueLiveFetch(interactionId)}).on("postgres_changes",{event:"*",schema:"public",table:"interactions",filter:"id=eq."+interactionId},function(){queueLiveFetch(interactionId)}).on("postgres_changes",{event:"*",schema:"public",table:"qa_upvotes"},function(){if(state.selectedInteraction&&state.selectedInteraction.type==="qa")queueLiveFetch(interactionId)}).subscribe(function(status){$("liveIndicator").textContent=status==="SUBSCRIBED"?"Live updating…":"Connecting…"})}
      function queueLiveFetch(interactionId){window.clearTimeout(liveFetchTimer);liveFetchTimer=window.setTimeout(function(){fetchLiveResults(interactionId)},120)}
      function setLiveIndicator(text){var el=$("liveIndicator");if(el)el.textContent=text}
      function unsubscribeRealtime(){window.clearTimeout(liveFetchTimer);window.clearTimeout(slideUpdateTimer);if(realtimeClient&&realtimeChannel){realtimeClient.removeChannel(realtimeChannel)}realtimeChannel=null;realtimeClient=null}
      boot();
    </script>
  </body>
