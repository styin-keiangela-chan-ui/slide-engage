<!doctype html>
<html>
  <head>
    <base target="_top">
    <style>
      body{font-family:Arial,sans-serif;margin:0;background:#f6faf7;color:#17172f}
      button,input,textarea,select{font:inherit}
      button{cursor:pointer}
      .wrap{padding:10px 10px 58px}
      .brand{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;margin:-10px -10px 8px;padding:10px;background:#f6faf7;border-bottom:1px solid #dfe9e3}
      .logo{width:30px;height:30px;border-radius:9px;background:#168a3a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
      .title{font-weight:800;font-size:16px}
      .muted{color:#6b7b8d}.small{font-size:12px}.hidden{display:none}
      .card{background:#fff;border:1px solid #dfe9e3;border-radius:12px;padding:9px;margin:7px 0;box-shadow:0 6px 18px rgba(14,63,34,.05)}
      .stack{display:flex;flex-direction:column;gap:6px}.row{display:flex;gap:7px;align-items:center;justify-content:space-between}.row.wraprow{flex-wrap:wrap}
      .avatar{width:28px;height:28px;border-radius:999px;background:#eaf7ef;color:#168a3a;display:grid;place-items:center;font-weight:900}
      .user{min-width:0;display:flex;align-items:center;gap:7px}
      .user b{max-width:128px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
      .input{width:100%;box-sizing:border-box;border:1px solid #d6e2dc;border-radius:9px;padding:8px;background:#fff;color:#17172f;font-size:13px}
      .btn{border:0;border-radius:9px;background:#168a3a;color:#fff;font-weight:800;padding:8px 10px;font-size:13px;transition:transform .12s ease,filter .12s ease,background .15s ease,border-color .15s ease}
      .btn.secondary{background:#fff;color:#17172f;border:1px solid #d6e2dc}
      .btn.danger{background:#fff;color:#b42318;border:1px solid #f0c6c6}
      .btn.smallbtn{padding:7px 9px;font-size:12px}
      .btn:hover:not(:disabled){filter:brightness(.96)}
      .btn:active:not(:disabled),.btn.pressed{transform:scale(.97);filter:brightness(.92)}
      .btn:disabled{opacity:.55;cursor:not-allowed}
      .btn.is-loading{cursor:wait;opacity:.82}
      .btn.is-success{background:#168a3a;color:#fff;border-color:#168a3a}
      .btn.is-error{background:#fff0f0;color:#b42318;border-color:#f0c6c6}
      .spinner{display:inline-block;width:12px;height:12px;margin-right:6px;border:2px solid currentColor;border-right-color:transparent;border-radius:999px;vertical-align:-2px;animation:spin .75s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
      .main-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
      .compact-controls{display:grid;grid-template-columns:1fr 1fr;gap:6px}
      .template{min-height:62px;border:1px solid #dfe9e3;border-radius:12px;padding:8px;background:#fff;text-align:center;font-weight:800;font-size:11px;display:grid;place-items:center;gap:3px;transition:background .15s ease,border-color .15s ease,transform .15s ease}
      .template:hover,.template:focus{transform:translateY(-1px)}
      .template span:first-child{font-size:18px;line-height:1}
      .template:hover,.item:hover{border-color:#168a3a;background:#f3fbf6}
      .item{border:1px solid #dfe9e3;border-radius:10px;padding:8px;background:#fff;text-align:left}
      .item.active{border-color:#168a3a;background:#eaf7ef}
      .interaction-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
      .row-actions{display:flex;gap:5px;align-items:center}
      .advanced{border:1px solid #dfe9e3;border-radius:10px;padding:8px;background:#fbfffc}
      .advanced summary{cursor:pointer;font-size:12px;font-weight:900;color:#17172f}
      .pill{border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;text-transform:capitalize}
      .pill.draft{background:#f3f4f6;color:#5b6470}.pill.live{background:#eaf7ef;color:#168a3a}.pill.closed{background:#fff3e2;color:#b85b00}
      .status{padding:10px;border-radius:10px;background:#eaf7ef;color:#168a3a;font-weight:700}
      .error{background:#fff0f0;color:#b42318}.permission{background:#fff8e6;color:#7a4b00;border:1px solid #f3d184}
      .link{color:#168a3a;font-weight:800;text-decoration:none}
      .divider{height:1px;background:#e6eee9;margin:3px 0}
      .section-toggle{width:100%;border:0;background:transparent;padding:0;display:flex;justify-content:space-between;font-weight:900;color:#17172f}
      .bottom-bar{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:8px 10px;background:rgba(246,250,247,.96);border-top:1px solid #dfe9e3;z-index:5}
      .live-panel{border:1px solid #cbead4;background:linear-gradient(180deg,#ffffff,#f3fbf6)}
      .live-flash{animation:liveFlash 2s ease}
      @keyframes liveFlash{0%,100%{box-shadow:0 6px 18px rgba(14,63,34,.05)}25%{box-shadow:0 0 0 4px rgba(22,138,58,.18),0 10px 26px rgba(14,63,34,.12)}}
      .live-dot{width:8px;height:8px;border-radius:999px;background:#168a3a;box-shadow:0 0 0 4px rgba(22,138,58,.12)}
      .bar-row{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;margin:6px 0}
      .bar-track{height:8px;border-radius:999px;background:#e3e7e5;overflow:hidden;margin-top:3px}
      .bar-fill{height:100%;border-radius:999px;background:#168a3a}
      .wordbox{min-height:120px;border:1px dashed #cbead4;border-radius:12px;padding:8px;background:#fbfffc;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:8px;overflow:hidden}
      .word{font-weight:900;line-height:1;color:#168a3a}
      .response-card{border:1px solid #e4eee8;border-radius:10px;padding:7px;background:#fff;font-size:12px}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">
        <div class="logo">🎯</div>
        <div>
          <div class="title">SlideEngage</div>
          <div class="small muted">Google Slides Add-on</div>
        </div>
      </div>
      <div id="status" class="status hidden" role="status" aria-live="polite"></div>

      <section id="login" class="card stack">
        <b>Lecturer login</b>
        <div class="small muted">Use your SlideEngage website email/Gmail and password.</div>
        <div id="permission" class="status permission hidden"></div>
        <button id="authorizeButton" class="btn secondary" onclick="authorize()" title="Authorize Google Slides Add-on" aria-label="Authorize Google Slides Add-on">Authorize Google Slides Add-on</button>
        <input id="email" class="input" placeholder="Email">
        <input id="password" class="input" type="password" placeholder="Password">
        <button id="loginButton" class="btn" onclick="login()" title="Sign in to SlideEngage" aria-label="Sign in to SlideEngage">Sign in</button>
      </section>

      <section id="app" class="hidden">
        <div class="row">
          <div class="user">
            <div class="avatar" id="avatar">A</div>
            <b id="hello"></b>
          </div>
          <button id="logoutButton" class="btn secondary smallbtn" onclick="logout()" title="Logout" aria-label="Logout">Logout</button>
        </div>

        <div class="card stack" id="event-card">
          <button class="section-toggle" onclick="toggleSection('event-body')" type="button"><span>Event</span><span>⌄</span></button>
          <div id="event-body" class="stack">
          <select id="events" class="input" onchange="selectEvent()"></select>
          <div id="eventInfo" class="small muted">Select or create an event.</div>
          <button class="btn secondary smallbtn" onclick="toggleNewEvent()" type="button">+ New Event</button>
          <div id="new-event-row" class="row hidden">
            <input id="newEventName" class="input" placeholder="New event name">
            <button id="createEventButton" class="btn smallbtn" onclick="createEvent()" title="Create a new event" aria-label="Create a new event">Create</button>
          </div>
          </div>
        </div>

        <div class="card stack">
          <button class="section-toggle" onclick="toggleSection('templates')" type="button"><span>Create New Interaction</span><span>⌄</span></button>
          <div id="templates" class="grid"></div>
        </div>

        <div class="card stack">
          <div class="row">
            <b>Interactions</b>
            <button id="refreshButton" class="btn secondary smallbtn" onclick="refresh()" title="Reload latest data" aria-label="Reload latest data">Refresh</button>
          </div>
          <div id="interactions" class="stack"></div>
        </div>

        <div id="editor" class="card stack hidden">
          <div class="row">
            <b id="editorTitle">Editor</b>
            <span id="interactionStatus" class="pill draft">Draft</span>
          </div>
          <textarea id="question" class="input" rows="3" placeholder="Question"></textarea>
          <div id="options" class="stack"></div>
          <button id="addOption" class="btn secondary hidden" onclick="addOption()">+ Add option</button>
          <details class="advanced">
            <summary>Advanced settings</summary>
            <div id="settings" class="stack" style="margin-top:8px"></div>
          </details>
        </div>

        <div id="liveControls" class="card stack hidden">
          <b>Actions</b>
          <div class="main-actions">
            <button id="presentLiveButton" class="btn" onclick="presentLive()" title="Present this interaction" aria-label="Present this interaction">Present</button>
            <button id="saveInteractionButton" class="btn secondary" onclick="saveInteraction()" title="Save interaction" aria-label="Save interaction">Save</button>
            <button id="resetResultsButton" class="btn danger" onclick="resetResults()" title="Reset participant responses" aria-label="Reset participant responses">Reset</button>
          </div>
          <div id="postPresentControls" class="compact-controls hidden">
            <button id="openPresenterButton" class="btn secondary smallbtn" onclick="openPresenter()" title="View live results" aria-label="View live results">Live Results</button>
            <button id="stopButton" class="btn secondary smallbtn" onclick="closeLive()" title="Stop accepting responses" aria-label="Stop accepting responses">Stop</button>
          </div>
        </div>

        <div id="liveResults" class="card stack live-panel hidden">
          <div class="row">
            <b>Live Results</b>
            <span class="row small muted" style="gap:5px"><span class="live-dot"></span><span id="liveIndicator">Live updating…</span></span>
          </div>
          <div id="liveResultsBody" class="stack small muted">Present to see responses here.</div>
        </div>

        <div class="bottom-bar">
          <button id="bottomRefreshButton" class="btn secondary smallbtn" onclick="refresh()" title="Reload latest data" aria-label="Reload latest data">Refresh</button>
          <button id="bottomAddSlideButton" class="btn smallbtn" onclick="presentLive()" title="Present this interaction" aria-label="Present this interaction">Present</button>
          <button id="bottomLiveResultsButton" class="btn secondary smallbtn" onclick="openPresenter()" title="View live results" aria-label="View live results">Results</button>
        </div>
      </section>
    </div>

    <script>
      var REALTIME_CONFIG={url:'<?= getSupabaseUrl_() ?>',anonKey:'<?= getSupabaseAnonKey_() ?>'};
      var state={session:null,events:[],selectedEvent:null,interactions:[],selectedInteraction:null,template:null,options:[],config:{},liveResults:null};
      var realtimeClient=null;
      var realtimeChannel=null;
      var liveFetchTimer=null;
      var slideUpdateTimer=null;
      var slideUpdateInFlight=false;
      var pendingSlideUpdateInteractionId=null;
      var liveSlideActive=false;
      var slideCreateInFlight=false;
      var actionStates={};
      var actionResetTimers={};
      var actionLabels={
        authorize:{ids:["authorizeButton"],idle:"Authorize Google Slides Add-on",loading:"Authorizing…",success:"Authorized ✓",error:"Authorize"},
        login:{ids:["loginButton"],idle:"Sign in",loading:"Signing in…",success:"Signed in ✓",error:"Sign in"},
        createEvent:{ids:["createEventButton"],idle:"Create",loading:"Creating…",success:"Created ✓",error:"Create"},
        refresh:{ids:["refreshButton","bottomRefreshButton"],idle:"Refresh",loading:"Refreshing…",success:"Updated ✓",error:"Refresh"},
        save:{ids:["saveInteractionButton"],idle:"Save",loading:"Saving…",success:"Saved ✓",error:"Save"},
        goLive:{ids:[],idle:"Present",loading:"Preparing…",success:"Presenting ✓",error:"Present"},
        close:{ids:["stopButton"],idle:"Stop",loading:"Stopping…",success:"Stopped ✓",error:"Stop"},
        reset:{ids:["resetResultsButton"],idle:"Reset",loading:"Resetting…",success:"Reset complete ✓",error:"Reset"},
        deleteInteraction:{ids:["deleteInteractionButton"],idle:"🗑 Delete Interaction",loading:"Deleting…",success:"Deleted ✓",error:"🗑 Delete Interaction"},
        addPresentation:{ids:["presentLiveButton","bottomAddSlideButton"],idle:"Present",bottomIdle:"Present",loading:"Preparing…",success:"Presenting ✓",error:"Present"},
        openPresenter:{ids:["openPresenterButton","bottomLiveResultsButton"],idle:"Live Results",bottomIdle:"Results",loading:"Opening…",success:"Opened ✓",error:"Live Results"}
      };
      var templates=[
        {label:"Multiple Choice",type:"poll",options:["Option 1","Option 2"],config:{poll_kind:"multiple_choice",multiple_answers:false,results_visible:true,voting_open:true}},
        {label:"Open Text",type:"feedback",options:[],config:{poll_kind:"open_text",character_limit:280,anonymous:true,voting_open:true}},
        {label:"Word Cloud",type:"word_cloud",options:[],config:{max_words_per_participant:3,allow_duplicate_words:true,voting_open:true}},
        {label:"Rating",type:"feedback",options:[],config:{poll_kind:"rating",scale:5,include_star_ratings:true,voting_open:true}},
        {label:"Quiz",type:"quiz",options:["Correct answer","Distractor"],config:{time_limit_seconds:30,points:100,voting_open:true}},
        {label:"Audience Q&A",type:"qa",options:[],config:{moderation:false,character_limit:160,allow_replies:false,allow_anonymous_questions:true,voting_open:true}}
      ];

      function $(id){return document.getElementById(id)}
      function show(message,isError){var s=$("status");s.textContent=message||"";s.className="status"+(isError?" error":"")+(message?"":" hidden")}
      function buttonLabel(config,state,id,message){if(message)return message;if(state==="loading")return config.loading;if(state==="success")return config.success;if(state==="error")return config.error;return id&&id.indexOf("bottom")===0&&config.bottomIdle?config.bottomIdle:config.idle}
      function setActionState(actionKey,state,message){var config=actionLabels[actionKey];if(!config)return;actionStates[actionKey]=state;if(actionResetTimers[actionKey]){window.clearTimeout(actionResetTimers[actionKey]);actionResetTimers[actionKey]=null}config.ids.forEach(function(id){var btn=$(id);if(!btn)return;var label=buttonLabel(config,state,id,message);btn.classList.remove("is-loading","is-success","is-error","pressed");btn.classList.toggle("is-loading",state==="loading");btn.classList.toggle("is-success",state==="success");btn.classList.toggle("is-error",state==="error");btn.classList.toggle("pressed",state==="loading");btn.disabled=state==="loading";btn.setAttribute("aria-busy",state==="loading"?"true":"false");btn.setAttribute("aria-disabled",state==="loading"?"true":"false");btn.innerHTML=(state==="loading"?"<span class=\"spinner\"></span>":"")+escapeHtml(label)});if(state==="success"||state==="error"){actionResetTimers[actionKey]=window.setTimeout(function(){setActionState(actionKey,"idle");if(actionKey==="addPresentation"&&liveSlideActive)renderLiveControls()},1800)}}
      function isActionLoading(actionKey){return actionStates[actionKey]==="loading"}
      function clearLoadingActionsToError(){Object.keys(actionStates).forEach(function(key){if(actionStates[key]==="loading")setActionState(key,"error")})}
      function highlightLiveSlideStatus(){var card=$("liveControls");if(!card)return;card.scrollIntoView({block:"nearest",behavior:"smooth"});card.classList.remove("live-flash");void card.offsetWidth;card.classList.add("live-flash")}
      function call(name,args,ok,statusText){if(statusText!==null)show(statusText===undefined?"Loading...":statusText);google.script.run.withSuccessHandler(function(result){if(statusText!==null)show("");ok&&ok(result)}).withFailureHandler(function(err){handleFailure(err)})[name].apply(null,args||[])}
      function handleFailure(err){clearLoadingActionsToError();if(slideCreateInFlight)setSlideCreating(false);var message=(err&&err.message)||String(err);if(/invalid email|invalid slideengage/i.test(message))message="Invalid SlideEngage email or password.";if(/Unable to load live results|Interaction not found|event for this slide|interaction for this slide/i.test(message))message="Unable to load live results. Please refresh and try again.";if(/UrlFetchApp|external_request|permission|authorization|not have permission|authorize|internet/i.test(message))message="Authorization required. Please click Authorize and allow Google permissions.";show(message||"Unable to complete. Please try again.",true);if(/authorize|permission|internet/i.test(message))checkAuthorization()}
      function boot(){renderTemplates();checkAuthorization();call("getInitialState",[],function(result){state.session=result.session;state.events=result.events||[];state.selectedEvent=result.selectedEvent||null;state.interactions=result.interactions||[];render()})}
      function checkAuthorization(){google.script.run.withSuccessHandler(function(result){var box=$("permission");if(!result||result.authorized){box.classList.add("hidden");return}box.innerHTML="Google permission is required before SlideEngage can connect to your account. <a class=\"link\" target=\"_blank\" href=\""+result.authorizationUrl+"\">Open authorization</a>";box.classList.remove("hidden")}).withFailureHandler(function(){}).getAuthorizationStatus()}

      function render(){
        if(state.session){$("login").classList.add("hidden");$("app").classList.remove("hidden");$("hello").textContent=state.session.lecturer.name||state.session.lecturer.email;$("hello").title=state.session.lecturer.email||"";$("avatar").textContent=((state.session.lecturer.name||state.session.lecturer.email||"A").charAt(0)||"A").toUpperCase()}
        else{$("login").classList.remove("hidden");$("app").classList.add("hidden")}
        renderEvents();renderInteractions();renderEditor();renderLiveControls();renderLiveResults()
      }
      function renderTemplates(){var box=$("templates");box.innerHTML="";templates.forEach(function(t){var b=document.createElement("button");b.className="template";b.innerHTML="<span>"+iconFor(t)+"</span><span>"+shortLabel(t.label)+"</span>";b.title=tooltipFor(t.label);b.setAttribute("aria-label",tooltipFor(t.label));b.onclick=function(){openTemplate(t)};box.appendChild(b)})}
      function renderEvents(){var sel=$("events");sel.innerHTML="";var placeholder=document.createElement("option");placeholder.textContent=state.events.length?"Select event":"No events yet";placeholder.value="";sel.appendChild(placeholder);state.events.forEach(function(event){var option=document.createElement("option");option.value=event.id;option.textContent=(event.event_name||"Untitled")+" (#"+event.event_code+")";if(state.selectedEvent&&state.selectedEvent.id===event.id)option.selected=true;sel.appendChild(option)});$("eventInfo").textContent=state.selectedEvent?"Code: #"+state.selectedEvent.event_code+" | "+(state.selectedEvent.status||"closed"):"Please select an event."}
      function renderInteractions(){var list=$("interactions");list.innerHTML="";if(!state.interactions.length){list.innerHTML="<div class=\"small muted\">Interactions will appear here.</div>";return}state.interactions.forEach(function(interaction){var row=document.createElement("div");row.className="item"+(state.selectedInteraction&&state.selectedInteraction.id===interaction.id?" active":"");row.setAttribute("role","button");row.setAttribute("tabindex","0");row.setAttribute("title","Edit interaction");row.setAttribute("aria-label","Edit interaction");var status=interaction.status||"draft";row.innerHTML="<div class=\"interaction-row\"><div style=\"min-width:0\"><b style=\"font-size:13px\">"+escapeHtml(interaction.title||"Untitled")+"</b><div class=\"small muted\">"+label(interaction)+" · "+status+"</div></div><div class=\"row-actions\"><button class=\"btn secondary smallbtn\" type=\"button\" title=\"Edit interaction\" aria-label=\"Edit interaction\">Edit</button><button class=\"btn smallbtn\" type=\"button\" title=\"Present this interaction\" aria-label=\"Present this interaction\">Present</button></div></div>";row.onclick=function(){openInteraction(interaction)};row.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();openInteraction(interaction)}};var buttons=row.querySelectorAll("button");buttons[0].onclick=function(e){e.stopPropagation();openInteraction(interaction)};buttons[1].onclick=function(e){e.stopPropagation();openInteraction(interaction);window.setTimeout(function(){presentLive()},0)};list.appendChild(row)})}
      function iconFor(t){return t.type==="poll"?"📊":t.type==="word_cloud"?"☁️":t.type==="quiz"?"🎯":t.type==="qa"?"💬":t.config&&t.config.poll_kind==="rating"?"⭐":"📝"}
      function shortLabel(label){return label==="Multiple Choice"?"Poll":label==="Open Text"?"Text":label==="Audience Q&A"?"Q&A":label}
      function tooltipFor(label){return label==="Multiple Choice"?"Create a poll with answer options":label==="Open Text"?"Collect text responses from participants":label==="Word Cloud"?"Create a live word cloud":label==="Rating"?"Create rating question":label==="Quiz"?"Create quiz":label==="Audience Q&A"?"Create audience Q&A":"Create interaction"}
      function toggleSection(id){$(id).classList.toggle("hidden")}
      function toggleNewEvent(){$("new-event-row").classList.toggle("hidden")}
      function renderEditor(){var editor=$("editor");if(!state.selectedInteraction&&!state.template){editor.classList.add("hidden");return}editor.classList.remove("hidden");$("editorTitle").textContent=state.template?state.template.label:label(state.selectedInteraction);var status=(state.selectedInteraction&&state.selectedInteraction.status)||"draft";$("interactionStatus").textContent=status;$("interactionStatus").className="pill "+status;$("question").value=(state.selectedInteraction&&state.selectedInteraction.title)||"";renderOptions();renderSettings()}
      function renderOptions(){var needs=needsOptions();$("addOption").classList.toggle("hidden",!needs);var box=$("options");box.innerHTML="";if(!needs)return;state.options.forEach(function(option,index){var row=document.createElement("div");row.className="row";row.innerHTML="<input class=\"input\" value=\""+escapeAttr(option.option_text||"")+"\" placeholder=\"Option "+(index+1)+"\"><button class=\"btn danger smallbtn\">×</button>";row.querySelector("input").oninput=function(){state.options[index].option_text=this.value};row.querySelector("button").onclick=function(){state.options.splice(index,1);renderOptions()};box.appendChild(row)})}
      function renderSettings(){var box=$("settings");box.innerHTML="";var type=currentType();if(type==="poll")box.innerHTML=checkboxSetting("multiple_answers","Multiple answers");if(type==="word_cloud")box.innerHTML=numberSetting("max_words_per_participant","Max words",1,10)+checkboxSetting("allow_duplicate_words","Allow duplicates");if(type==="feedback"&&state.config.poll_kind==="open_text")box.innerHTML=numberSetting("character_limit","Character limit",50,1000);if(type==="feedback"&&state.config.poll_kind==="rating")box.innerHTML=numberSetting("scale","Rating scale",2,10);if(type==="quiz")box.innerHTML=numberSetting("time_limit_seconds","Timer seconds",5,300);if(type==="qa")box.innerHTML=checkboxSetting("moderation","Moderation")+checkboxSetting("allow_replies","Replies")+numberSetting("character_limit","Character limit",50,500)}
      function renderLiveControls(){var visible=!!state.selectedEvent&&(!!state.selectedInteraction||!!state.template);$("liveControls").classList.toggle("hidden",!visible);$("postPresentControls").classList.toggle("hidden",!liveSlideActive);if(!isActionLoading("addPresentation")&&actionStates.addPresentation!=="success")setActionState("addPresentation","idle");if(liveSlideActive&&!isActionLoading("addPresentation")&&actionStates.addPresentation!=="success"){var main=$("presentLiveButton");var bottom=$("bottomAddSlideButton");if(main)main.textContent="Presenting ✓";if(bottom)bottom.textContent="Presenting ✓"}}
      function renderLiveResults(){var panel=$("liveResults");if(!state.selectedInteraction||!state.selectedEvent){panel.classList.add("hidden");return}panel.classList.remove("hidden");var body=$("liveResultsBody");var data=state.liveResults;if(!data){body.innerHTML="<div class=\"muted\">Present to see responses here.</div>";return}var interaction=data.interaction||state.selectedInteraction;var html="<div><b>"+escapeHtml(data.question||interaction.title||"Untitled")+"</b><div class=\"small muted\">#"+escapeHtml(data.eventCode||state.selectedEvent.event_code||"")+" · "+(data.total_responses||0)+" responses</div></div>";var results=data.results||[];if(interaction.type==="poll"||interaction.type==="quiz"){html+=renderPollResultsHtml(results)}else if(interaction.type==="word_cloud"){html+=renderWordCloudHtml(results)}else if(interaction.type==="qa"){html+=renderCardsHtml(results,"question_text","No questions yet.")}else if(interaction.type==="feedback"&&interaction.config&&interaction.config.poll_kind==="rating"){html+=renderRatingHtml(results)}else{var items=Array.isArray(results)?results:(results.text_responses||[]);html+=renderCardsHtml(items,"text","No responses yet.")}body.innerHTML=html;$("liveIndicator").textContent="Live updating…"}

      function checkboxSetting(key,labelText){return "<label class=\"small\"><input type=\"checkbox\" "+(state.config[key]?"checked":"")+" onchange=\"state.config['"+key+"']=this.checked\"> "+labelText+"</label>"}
      function numberSetting(key,labelText,min,max){return "<label class=\"small\">"+labelText+"<input class=\"input\" type=\"number\" min=\""+min+"\" max=\""+max+"\" value=\""+(state.config[key]||min)+"\" onchange=\"state.config['"+key+"']=Number(this.value)\"></label>"}
      function label(interaction){return interaction.type==="poll"?"Multiple Choice":interaction.type==="word_cloud"?"Word Cloud":interaction.type==="quiz"?"Quiz":interaction.type==="qa"?"Audience Q&A":interaction.config&&interaction.config.poll_kind==="rating"?"Rating":"Open Text"}
      function currentType(){return(state.template&&state.template.type)||(state.selectedInteraction&&state.selectedInteraction.type)}
      function needsOptions(){var type=currentType();return type==="poll"||type==="quiz"}

      function authorize(){if(isActionLoading("authorize"))return;setActionState("authorize","loading");call("authorizeSlideEngage",[],function(){setActionState("authorize","success");checkAuthorization();if($("email").value&&$("password").value){login();return}show("Google permission confirmed. Please sign in again.")})}

      function selectEvent(){unsubscribeRealtime();call("selectEvent",[$("events").value],function(result){state.selectedEvent=result.selectedEvent;state.interactions=result.interactions||[];state.selectedInteraction=null;state.template=null;state.options=[];state.config={};state.liveResults=null;render()})}
      function createEvent(){if(isActionLoading("createEvent"))return;setActionState("createEvent","loading");call("createEvent",[$("newEventName").value],function(result){$("newEventName").value="";$("new-event-row").classList.add("hidden");state.events=result.events||[];state.selectedEvent=result.selectedEvent;state.interactions=[];state.selectedInteraction=null;render();setActionState("createEvent","success");show("Event created.")})}

      function openInteraction(interaction){state.selectedInteraction=interaction;state.template=null;state.options=(interaction.interaction_options||[]).sort(function(a,b){return(a.position||0)-(b.position||0)}).map(function(option){return{option_text:option.option_text,is_correct:!!option.is_correct}});state.config=copy(interaction.config||{});call("getInteractionSlideState",[interaction.id],function(result){liveSlideActive=!!(result&&result.exists);renderLiveControls()},null);if(interaction.status==="live"){startLiveResults(interaction)}else{unsubscribeRealtime();state.liveResults=null}render()}
      function addOption(){state.options.push({option_text:"Option "+(state.options.length+1),is_correct:false});renderOptions()}
      function copy(obj){return JSON.parse(JSON.stringify(obj||{}))}
      function findInteraction(id){for(var i=0;i<state.interactions.length;i++){if(state.interactions[i].id===id)return state.interactions[i]}return null}
      function editorPayload(){return{id:state.selectedInteraction&&state.selectedInteraction.id,event_id:state.selectedEvent&&state.selectedEvent.id,type:currentType(),title:$("question").value.trim(),config:state.config,options:needsOptions()?state.options:[]}}
      function validatePayload(payload){if(!payload.event_id)return"Select or create an event first.";if(!payload.title)return"Question is required.";if((payload.type==="poll"||payload.type==="quiz")&&payload.options.filter(function(o){return String(o.option_text||"").trim()}).length<2)return"At least 2 options are required.";return""}
      function saveInteraction(done,actionKey){actionKey=actionKey===undefined?"save":actionKey;var payload=editorPayload();var error=validatePayload(payload);if(error){show(error,true);if(actionKey)setActionState(actionKey,"error");return}if(actionKey)setActionState(actionKey,"loading");call("saveInteraction",[payload],function(result){state.selectedInteraction=result.interaction;state.template=null;state.interactions=result.interactions||[];openInteraction(result.interaction);if(actionKey){setActionState(actionKey,"success");show(actionKey==="save"?"Saved ✓":"Interaction saved.")}else{show("Saved.")}done&&done(result.interaction)})}

      function confirmDeleteInteraction(interaction){if(!interaction)return false;if(interaction.status==="live"&&!confirm("This interaction is currently live.\n\nDeleting it will immediately stop participant submissions and remove all collected responses."))return false;return confirm("Delete Interaction?\n\nAre you sure you want to delete this interaction?\n\nThis action cannot be undone.")}

      function openPresenter(){if(isActionLoading("openPresenter"))return;if(!state.selectedEvent||!state.selectedInteraction){show("Select an interaction first.",true);return}setActionState("openPresenter","loading");console.log("[SlideEngage Google Slides] Opening live results",{eventId:state.selectedEvent.id,interactionId:state.selectedInteraction.id,interactionType:state.selectedInteraction.type});call("getLiveResultUrl",[state.selectedEvent.id,state.selectedInteraction.id],function(url){var separator=url.indexOf("?")>=0?"&":"?";var sourceUrl=url+separator+"source=google-slides";setActionState("openPresenter","success");showPresenterLink(sourceUrl,"Opening live results.");window.open(sourceUrl,"_blank")})}
